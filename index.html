<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Kesayangan Fran</title>
    <style>
        /* ----- RESET & BODY ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fdfcfb 100%);
            /* background love & bunga bergerak (dari pseudo-element) */
            position: relative;
            overflow: hidden;
        }

        /* ----- BACKGROUND BERGERAK (Love & Bunga) ----- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                /* Love (❤) */
                radial-gradient(circle at 10% 20%, rgba(255, 80, 120, 0.15) 0%, transparent 8%),
                radial-gradient(circle at 85% 30%, rgba(255, 80, 120, 0.12) 0%, transparent 10%),
                radial-gradient(circle at 40% 70%, rgba(255, 80, 120, 0.10) 0%, transparent 12%),
                radial-gradient(circle at 70% 80%, rgba(255, 80, 120, 0.08) 0%, transparent 10%),
                /* Bunga (bentuk sederhana pakai radial + conic) */
                radial-gradient(circle at 20% 60%, rgba(255, 200, 50, 0.15) 0%, transparent 7%),
                radial-gradient(circle at 75% 15%, rgba(255, 180, 100, 0.12) 0%, transparent 8%),
                radial-gradient(circle at 50% 90%, rgba(255, 220, 150, 0.10) 0%, transparent 10%),
                radial-gradient(circle at 5% 85%, rgba(255, 160, 80, 0.10) 0%, transparent 9%),
                radial-gradient(circle at 95% 65%, rgba(255, 200, 120, 0.08) 0%, transparent 10%);
            background-size: 200% 200%;
            animation: floatBg 20s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* tambahan elemen love & bunga yang lebih jelas (pakai pseudo kedua) */
        body::after {
            content: '❤ ✿ ❀ ✿ ❤ ✿ ❀ ✿ ❤';
            position: fixed;
            inset: 0;
            z-index: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            font-size: 2.8rem;
            color: rgba(255, 100, 150, 0.06);
            letter-spacing: 30px;
            pointer-events: none;
            animation: floatSymbols 25s linear infinite alternate;
            transform: scale(1.2);
        }

        @keyframes floatBg {
            0% {
                background-position: 0% 0%;
                transform: scale(1);
            }
            33% {
                transform: scale(1.02);
            }
            66% {
                background-position: 100% 100%;
                transform: scale(0.98);
            }
            100% {
                background-position: 50% 50%;
                transform: scale(1.01);
            }
        }

        @keyframes floatSymbols {
            0% {
                transform: translateY(0px) rotate(-2deg) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-20px) rotate(2deg) scale(1.1);
                opacity: 0.7;
            }
            100% {
                transform: translateY(10px) rotate(-1deg) scale(0.95);
                opacity: 0.4;
            }
        }

        /* ----- KOTAK WELCOME (di atas background) ----- */
        .welcome-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px 48px 48px 48px;
            padding: 3.5rem 4.5rem;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 20px 60px rgba(255, 80, 120, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: cardIn 1s ease-out;
        }

        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .welcome-card h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #b3415c;
            text-shadow: 0 4px 20px rgba(255, 80, 120, 0.2);
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            word-break: break-word;
        }

        .welcome-card .sub-heart {
            font-size: 1.8rem;
            color: #e05a7a;
            opacity: 0.7;
            margin-bottom: 2rem;
            letter-spacing: 12px;
        }

        /* ----- TOMBOL MASUK ----- */
        .btn-masuk {
            display: inline-block;
            padding: 1rem 3.5rem;
            background: linear-gradient(135deg, #ff6b8a, #ee4e6b);
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 12px 30px rgba(238, 78, 107, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            letter-spacing: 1.5px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-masuk:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 18px 40px rgba(238, 78, 107, 0.5);
            background: linear-gradient(135deg, #ff7a96, #e04765);
        }

        .btn-masuk:active {
            transform: scale(0.96);
            box-shadow: 0 6px 20px rgba(238, 78, 107, 0.3);
        }

        /* ----- RESPONSIF ----- */
        @media (max-width: 600px) {
            .welcome-card {
                padding: 2.5rem 1.8rem;
                border-radius: 32px;
            }
            .welcome-card h1 {
                font-size: 2rem;
            }
            .btn-masuk {
                padding: 0.8rem 2.5rem;
                font-size: 1.2rem;
            }
            body::after {
                font-size: 2rem;
                letter-spacing: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- CARD WELCOME -->
    <div class="welcome-card">
        <h1>💗 Welcome To<br />Web Kesayangan Fran</h1>
        <div class="sub-heart">❤ ✿ ❤ ✿ ❤</div>
        <!-- Tombol Masuk -->
        <button class="btn-masuk" onclick="alert('Halo Fran! ❤️ Selamat datang di web spesial untukmu!')">✨ Masuk ✨</button>
        <!-- (Kamu bisa ganti onclick dengan link / fungsi lain nanti) -->
    </div>

</body>
</html>
